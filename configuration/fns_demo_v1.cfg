# FNS October 8 demo, version-1 infrastructure baseline.
#
# This provisions one Kubernetes control-plane VM, three worker VMs, and one
# endpoint VM. Deploy the image-batch adapter separately from
# application/image_batch/manifests/adapter.yaml while its Continuum launcher
# integration remains under development.
[infrastructure]
provider = qemu
# Continuum stores generated state in <base_path>/.continuum.
base_path = /mnt/sdc/matthijs

# The first cloud node is the Kubernetes control plane; the remaining three are
# workers. Four vCPUs per VM keeps this topology within the host's 20 pinned
# hardware threads (4 * 4 cloud + 1 * 2 endpoint = 18).
cloud_nodes = 4
cloud_cores = 4
cloud_memory = 16
cloud_quota = 1.0

endpoint_nodes = 1
endpoint_cores = 2
endpoint_memory = 4
endpoint_quota = 1.0

cpu_pin = True

# Cellular access to the cloud, followed by the student's static core profile.
# The source revision is pinned in the QEMU mahimahi-build.json manifest.
network_emulation = True
wireless_network_preset = 5g_nl_kpn_mahimahi
cloud_location = eu_central_1
edge_location = base_edge
# Cloud-to-cloud stays wired; the endpoint core profile is 3.125 +/- 0.01 ms
# per direction. The 10000 Mbit/s cap and minimal jitter are modeling defaults.
cloud_throughput = 1000

middleIP = 210
middleIP_base = 211
delete = False

[benchmark]
resource_manager = kubernetes
resource_manager_only = True
observability = True
