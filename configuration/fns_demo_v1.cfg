# FNS October 8 demo, version-1 infrastructure baseline.
#
# This provisions one Kubernetes control-plane VM, two worker VMs, and one
# endpoint VM. Deploy the image-batch adapter separately from
# application/image_batch/manifests/adapter.yaml while its Continuum launcher
# integration remains under development.
[infrastructure]
provider = qemu
# Continuum stores generated state in <base_path>/.continuum.
base_path = /mnt/sdc/matthijs

# The first cloud node is the Kubernetes control plane; the remaining two are
# workers. Four vCPUs per VM keeps this topology within the host's 20 pinned
# hardware threads (3 * 4 cloud + 1 * 2 endpoint = 14).
cloud_nodes = 3
cloud_cores = 4
cloud_memory = 16
cloud_quota = 1.0

endpoint_nodes = 1
endpoint_cores = 2
endpoint_memory = 4
endpoint_quota = 1.0

cpu_pin = True

# The unshaped endpoint path is the protected baseline. Enable MahiMahi only
# after the trace files and setup scripts referenced by Gleb's commit have
# been recovered and verified.
network_emulation = False

middleIP = 210
middleIP_base = 211
delete = False

[benchmark]
resource_manager = kubernetes
resource_manager_only = True
observability = True
