[#] Network validation: manual throughput/latency overrides without preset
[infrastructure]
provider = qemu

infra_only = True

cloud_nodes = 1
cloud_cores = 2
cloud_memory = 2

edge_nodes = 1
edge_cores = 2
edge_memory = 2

endpoint_nodes = 1
endpoint_cores = 2
endpoint_memory = 2

network_emulation = True
netperf = True

# No wireless_network_preset here; rely purely on manual overrides below.
cloud_endpoint_latency_avg = 30
cloud_endpoint_latency_var = 5
cloud_endpoint_throughput = 10

edge_endpoint_latency_avg = 10
edge_endpoint_latency_var = 2
edge_endpoint_throughput = 10

