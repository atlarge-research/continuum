#!/usr/bin/env ansible-playbook
---
- name: Install OpenFaaS
  hosts: cloudcontroller
  become: true
  tasks:
    - name: Install arkade via official installer
      ansible.builtin.shell: |
        set -o pipefail
        curl -SLsf https://get.arkade.dev/ | sudo sh
      args:
        executable: /bin/bash
        creates: /usr/local/bin/arkade

    - name: Check if OpenFaaS namespace exists
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Namespace
        name: openfaas
        kubeconfig: /etc/kubernetes/admin.conf
      register: ns_info
      changed_when: false

    - name: Install OpenFaaS via arkade (only if namespace missing)
      ansible.builtin.command: arkade install openfaas-ce
      when: ns_info.resources | length == 0

    - name: Install OpenFaaS CLI into /usr/local/bin
      ansible.builtin.command: arkade get faas-cli --path /usr/local/bin
      args:
        creates: "/usr/local/bin/faas-cli"

    - name: Wait for gateway to be Available
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: openfaas
        name: gateway
        kubeconfig: /etc/kubernetes/admin.conf
        wait: true
        wait_timeout: 1800   # 30m
        wait_sleep: 5
        wait_condition:
          type: Available
          status: "True"
      changed_when: false

    ########################################################
    - name: Enable OpenFaaS port forwarding
      ansible.builtin.shell: nohup kubectl port-forward -n openfaas svc/gateway 8080:8080 >/dev/null 2>&1 &
      changed_when: true

    - name: Wait for gateway to respond on port-forward
      ansible.builtin.shell: |
        for i in $(seq 1 60); do
          curl -sf http://127.0.0.1:8080/healthz >/dev/null && exit 0
          sleep 2
        done
        exit 1
      changed_when: true

    - name: Login to OpenFaaS
      ansible.builtin.shell: |
        set -o pipefail
        kubectl get secret -n openfaas basic-auth -o jsonpath="{.data.basic-auth-password}" \
          | base64 --decode \
          | faas-cli login --username admin --password-stdin
      args:
        executable: /bin/bash
      changed_when: false