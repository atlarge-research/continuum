---
schema_version: 1
kind: ContinuumSoftware

software:
  modules:
    - id: kubeedge-main
      type: kubeedge
      assign_to:
        any_of:
          - cluster: cloud-1
          - cluster: edge-1
      config:
        kube_version: "v1.27.0"
        cache_worker: false
    - id: endpoint-runtime
      type: endpoint_runtime
      assign_to:
        match:
          cluster: endpoint-1
      config: {}
