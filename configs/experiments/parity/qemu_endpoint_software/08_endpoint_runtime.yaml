---
schema_version: 1
kind: ContinuumExperiment

use:
  environment: local-qemu-delete-on-exit
  software: endpoint-runtime

run:
  targets: [infrastructure, software]
  image_prefetch: "off"
  dry_run: false
  clean: false

infrastructure:
  clusters:
    - id: endpoint-1
      tier: endpoint
      resources:
        vms:
          count: 2
          spec:
            cores: 2
            memory_gb: 3
            cpu_quota: 0.75
  network:
    emulation: true
    wireless_preset: 4g
    overrides: {}
