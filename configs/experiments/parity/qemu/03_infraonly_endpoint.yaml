---
schema_version: 1
kind: ContinuumExperiment

use:
  environment: local-qemu
  software: none-endpoint

run:
  targets: [infrastructure]
  registry_refresh: missing
  dry_run: false
  clean: false

infrastructure:
  clusters:
    - id: endpoint-1
      tier: endpoint
      resources:
        vms:
          count: 4
          spec:
            cores: 1
            memory_gb: 2
            cpu_quota: 0.5
  network:
    emulation: true
    wireless_preset: 4g
    overrides: {}
