---
schema_version: 1
kind: ContinuumExperiment

use:
  environment: local-qemu-cpupin
  software: none-edge

run:
  targets: [infrastructure]
  registry_refresh: missing

infrastructure:
  clusters:
    - id: edge-1
      tier: edge
      resources:
        vms:
          count: 2
          spec:
            cores: 2
            memory_gb: 2
            cpu_quota: 1.0
  network:
    emulation: true
    wireless_preset: 4g
    overrides: {}
