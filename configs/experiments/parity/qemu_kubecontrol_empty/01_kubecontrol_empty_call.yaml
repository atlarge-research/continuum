---
schema_version: 1
kind: ContinuumExperiment

use:
  environment: local-qemu-cpupin
  software: kubecontrol

run:
  targets: [infrastructure, software, application]
  image_prefetch: "off"
  dry_run: false
  clean: false

infrastructure:
  clusters:
    - id: cloud-1
      tier: cloud
      resources:
        vms:
          count: 2
          spec:
            cores: 8
            memory_gb: 32
            cpu_quota: 1.0
  network:
    emulation: false
    wireless_preset: 4g
    overrides: {}

benchmark:
  pipeline:
    - id: empty-call
      type: empty
      assign_to:
        match:
          cluster: cloud-1
      tags:
        benchmark.role: columbo-control-plane
        paper: columbo
      config:
        sleep_time: 30
        applications_per_worker: 1
        application_worker_cpu: 0.05
        application_worker_memory: 0.5
