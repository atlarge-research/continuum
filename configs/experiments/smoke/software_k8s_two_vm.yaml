---
schema_version: 1
kind: ContinuumExperiment

use:
  environment: local-qemu
  software: k8s

run:
  targets: [infrastructure, software]
  registry_refresh: missing
  dry_run: false
  clean: false

infrastructure:
  clusters:
    - id: cloud-1
      tier: cloud
      resources:
        vms:
          count: 2
          spec:
            cores: 2
            memory_gb: 2
            cpu_quota: 1.0
