schema_version: 1
kind: ContinuumExperiment

use:
  environment: local-qemu-netperf
  software: none

run:
  targets: [infrastructure]
  dry_run: false
  clean: false

infrastructure:
  clusters:
    - id: cloud-1
      tier: cloud
      resources:
        vms:
          count: 1
          spec: { cores: 2, memory_gb: 2, cpu_quota: 1.0 }
    - id: edge-1
      tier: edge
      resources:
        vms:
          count: 1
          spec: { cores: 2, memory_gb: 2, cpu_quota: 1.0 }
    - id: endpoint-1
      tier: endpoint
      resources:
        vms:
          count: 1
          spec: { cores: 2, memory_gb: 2, cpu_quota: 1.0 }
  network:
    emulation: true
    wireless_preset: 4g
    overrides: {}
