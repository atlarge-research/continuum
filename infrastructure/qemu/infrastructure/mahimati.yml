---
- hosts: endpoints
  become: true
  vars_files:
    - "{{ playbook_dir }}/mahimahi-build.json"
  tasks:
    - name: Check inherited source revision
      stat:
        path: "/home/mahimahi/.installed-{{ mahimahi_revision }}-{{ mahimahi_patch_id }}"
      register: installed_revision

    - name: Check inherited replay binary
      stat:
        path: /usr/local/bin/mm-link
      register: installed_binary

    - name: Require a replay-ready base image
      assert:
        that:
          - installed_revision.stat.exists
          - installed_binary.stat.exists
          - installed_binary.stat.executable | default(false)
        fail_msg: >-
          MahiMahi is missing or outdated in the endpoint base image.
          Rebuild the base image with network_emulation=True and a MahiMahi preset;
          VM startup never installs or compiles MahiMahi.

    - name: Read inherited source revision
      slurp:
        src: "/home/mahimahi/.installed-{{ mahimahi_revision }}-{{ mahimahi_patch_id }}"
      register: installed_identity

    - name: Verify inherited source revision
      assert:
        that:
          - (installed_identity.content | b64decode | trim) == mahimahi_revision
        fail_msg: "MahiMahi installation identity differs; rebuild the endpoint base image."

    - name: Install expected build identity
      copy:
        src: "{{ playbook_dir }}/mahimahi-build.json"
        dest: /home/mahimahi/mahimahi-build.json
        owner: root
        group: root
        mode: '0644'

    - name: Install the checked Continuum replay launcher
      copy:
        src: "{{ playbook_dir }}/continuum_replay.py"
        dest: /home/mahimahi/continuum_replay.py
        owner: root
        group: root
        mode: '0755'
