---
rm_k8s_control_plane_cloud_ip: "{{ cloud_ip | default(continuum_cloud_ip | default('')) }}"
rm_k8s_control_plane_cloud_ip_external: "{{ cloud_ip_external | default(continuum_cloud_ip_external | default('')) }}"
rm_k8s_control_plane_username: "{{ username | default(continuum_username | default('ubuntu')) }}"
rm_k8s_control_plane_cloud_mode: "{{ cloud_mode | default(continuum_cloud_mode | default(1)) }}"
rm_k8s_control_plane_kubeversion: "{{ kubeversion | default(continuum_kubeversion | default('1.27.0')) }}"
rm_k8s_control_plane_registry_ip: "{{ registry_ip | default(continuum_registry_ip | default('')) }}"
rm_k8s_control_plane_continuum_home: "{{ continuum_home | default('/tmp') }}"
rm_k8s_control_plane_ignore_preflight_errors: "{{ ignore_preflight_errors | default(false) }}"
rm_k8s_control_plane_kubeadm_config_file: "{{ kubeadm_config_file | default('') }}"
rm_k8s_control_plane_flannel_manifest: >-
  {{ flannel_manifest | default('https://github.com/flannel-io/flannel/releases/download/v0.28.0/kube-flannel.yml') }}
