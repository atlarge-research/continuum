---
- name: Install arkade
  ansible.builtin.shell: |
    set -o pipefail
    curl -SLsf https://get.arkade.dev/ | sh
  args:
    executable: /bin/bash
    creates: /usr/local/bin/arkade

- name: Check if OpenFaaS gateway deployment exists
  ansible.builtin.command:
    cmd: kubectl get deployment -n openfaas gateway
  register: openfaas_gateway_state
  changed_when: false
  failed_when: false
  environment:
    KUBECONFIG: "{{ rm_openfaas_install_kubeconfig }}"

- name: Install OpenFaaS CE with arkade
  ansible.builtin.command: arkade install openfaas-ce
  when: openfaas_gateway_state.rc != 0
  register: openfaas_install_result
  retries: "{{ rm_openfaas_install_retries }}"
  delay: "{{ rm_openfaas_install_retry_delay }}"
  until: openfaas_install_result.rc == 0
  changed_when: true
  environment:
    KUBECONFIG: "{{ rm_openfaas_install_kubeconfig }}"

- name: Install faas-cli
  ansible.builtin.command: arkade get faas-cli --path /usr/local/bin
  args:
    creates: /usr/local/bin/faas-cli

- name: Wait for OpenFaaS gateway deployment
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/gateway -n openfaas --timeout=1800s
  changed_when: false
  environment:
    KUBECONFIG: "{{ rm_openfaas_install_kubeconfig }}"

- name: Install OpenFaaS gateway port-forward service
  ansible.builtin.copy:
    dest: /etc/systemd/system/openfaas-gateway-port-forward.service
    mode: "0644"
    content: |
      [Unit]
      Description=OpenFaaS gateway kubectl port-forward
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/bin/kubectl \
        --kubeconfig={{ rm_openfaas_install_kubeconfig }} \
        port-forward -n openfaas svc/gateway {{ rm_openfaas_install_gateway_port }}:8080 \
        --address {{ rm_openfaas_install_gateway_address }}
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

- name: Ensure OpenFaaS gateway port-forward service is running
  ansible.builtin.systemd:
    name: openfaas-gateway-port-forward.service
    daemon_reload: true
    enabled: true
    state: restarted

- name: Wait for OpenFaaS gateway health endpoint
  ansible.builtin.shell: |
    for i in $(seq 1 60); do
      curl -sf http://127.0.0.1:{{ rm_openfaas_install_gateway_port }}/healthz >/dev/null && exit 0
      sleep 2
    done
    exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Login OpenFaaS CLI
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get secret -n openfaas basic-auth -o jsonpath="{.data.basic-auth-password}" \
      | base64 --decode \
      | faas-cli login --username admin --password-stdin
  args:
    executable: /bin/bash
  changed_when: false
  environment:
    KUBECONFIG: "{{ rm_openfaas_install_kubeconfig }}"

- name: Verify OpenFaaS CLI gateway access
  ansible.builtin.command:
    cmd: "faas-cli list --gateway http://127.0.0.1:{{ rm_openfaas_install_gateway_port }}"
  changed_when: false
