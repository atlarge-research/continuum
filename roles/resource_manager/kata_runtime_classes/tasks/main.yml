---
- name: Ensure RuntimeClass manifest directory exists
  ansible.builtin.file:
    path: "{{ rm_kata_runtime_classes_manifest_dir }}"
    state: directory
    mode: "0755"

- name: Write RuntimeClass manifests
  ansible.builtin.copy:
    dest: "{{ rm_kata_runtime_classes_manifest_dir }}/{{ item.name }}.yaml"
    mode: "0644"
    content: |
      apiVersion: node.k8s.io/v1
      kind: RuntimeClass
      metadata:
        name: {{ item.name }}
      handler: {{ item.handler }}
  loop:
    - name: kata-fc
      handler: kata-fc
    - name: kata-qemu
      handler: kata-qemu
    - name: runc
      handler: runc

- name: Apply RuntimeClass manifests
  ansible.builtin.command: "kubectl apply -f {{ rm_kata_runtime_classes_manifest_dir }}/{{ item }}.yaml"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  loop:
    - kata-fc
    - kata-qemu
    - runc
  changed_when: false
