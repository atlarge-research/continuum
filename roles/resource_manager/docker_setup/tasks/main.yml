---
- name: Detect Docker upstream apt repository
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/docker.list
  register: rm_docker_setup_upstream_repo

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Select compatible docker engine packages
  ansible.builtin.set_fact:
    rm_docker_setup_engine_packages: >-
      {{
        rm_docker_setup_upstream_engine_packages
        if (
          rm_docker_setup_upstream_repo.stat.exists
          or "containerd.io" in (ansible_facts.packages | default({}))
        )
        else rm_docker_setup_ubuntu_engine_packages
      }}

- name: Install docker engine package
  ansible.builtin.apt:
    name: "{{ rm_docker_setup_engine_packages }}"
    state: present
    update_cache: true
  register: rm_docker_setup_install_result
  until: >-
    rm_docker_setup_install_result is succeeded or
    (rm_docker_setup_install_result.rc | default(-1)) != 100 or
    not ((rm_docker_setup_install_result.stderr | default('')) is match(
      '^E: Could not get lock /var/lib/dpkg/lock-frontend[.] It is held by process [1-9][0-9]* [(]unattended-upgr[)]\n'
      'E: Unable to acquire the dpkg frontend lock [(]/var/lib/dpkg/lock-frontend[)], is another process using it[?]\n?\\Z'
    ))
  retries: 30
  delay: 10

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ rm_docker_setup_username }}"
    groups: docker
    append: true

- name: Configure insecure docker registry
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "insecure-registries": ["{{ rm_docker_setup_registry_ip }}"]
      }
  when: rm_docker_setup_registry_ip | length > 0
  register: rm_docker_setup_registry_cfg

- name: Ensure docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Restart docker after config update
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: rm_docker_setup_registry_cfg is defined and rm_docker_setup_registry_cfg.changed
