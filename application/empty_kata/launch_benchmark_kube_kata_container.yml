---
- name: Launch benchmark for kube_kata with one container per pod/job
  hosts: cloudcontroller
  become: true
  roles:
    - role: k8s_job_deploy
      vars:
        app_k8s_job_deploy_layout: multi_container
        app_k8s_job_deploy_env:
          - name: SLEEP_TIME
            value: "{{ sleep_time }}"
