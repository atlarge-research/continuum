---
- name: Launch benchmark for kubecontrol with one container per pod/job
  hosts: cloudcontroller
  become: true
  tasks:
    - name: Create job file
      ansible.builtin.copy:
        dest: "/home/{{ username }}/job-template.yaml"
        mode: '0644'
        content: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: {{ app_name }}
          spec:
            template:
              metadata:
                name: {{ app_name }}
              spec:
                restartPolicy: Never
                containers:
          {% for i in range(1, replicas + 1) %}
              - name: {{ app_name }}-{{ i }}
                image: {{ image }}
                imagePullPolicy: {{ pull_policy }}
                resources:
                  requests:
                    memory: "{{ memory_req }}Mi"
                    cpu: {{ cpu_req }}
                env:
                - name: SLEEP_TIME
                  value: "{{ sleep_time }}"
          {% endfor %}
