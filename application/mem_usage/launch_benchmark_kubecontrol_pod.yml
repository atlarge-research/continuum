---
- name: Launch benchmark for kubecontrol mem_usage pod
  hosts: cloudcontroller
  become: true
  tasks:
    - name: Create job file
      ansible.builtin.copy:
        dest: "/home/{{ username }}/job-template.yaml"
        mode: '0644'
        content: |
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: {{ app_name }}
          spec:
            parallelism: {{ replicas }}
            template:
              metadata:
                name: {{ app_name }}
              spec:
{% if runtime is defined and runtime %}
                runtimeClassName: {{ runtime }}
{% endif %}
                containers:
                - name: {{ app_name }}
                  image: {{ image }}
                  imagePullPolicy: {{ pull_policy }}
                  # resources:
                  #   requests:
                  #     memory: "{{ memory_req }}Mi"
                  #     cpu: {{ cpu_req }}
                  env:
                  - name: SLEEP_TIME
                    value: "{{ sleep_time }}"
                restartPolicy: Never
