apiVersion: v1
kind: Namespace
metadata:
  name: fns-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-batch-adapter
  namespace: fns-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-batch-job-submitter
  namespace: fns-demo
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-batch-adapter
  namespace: fns-demo
subjects:
  - kind: ServiceAccount
    name: image-batch-adapter
    namespace: fns-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: image-batch-job-submitter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-batch-adapter
  namespace: fns-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: image-batch-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-batch-adapter
    spec:
      serviceAccountName: image-batch-adapter
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: adapter
          image: continuum/image-batch-adapter:fns-v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RUN_ID
              value: fns-v1-manual
            - name: PUBLIC_BASE_URL
              value: http://image-batch-adapter.fns-demo.svc.cluster.local:8080
            - name: JOB_NAMESPACE
              value: fns-demo
            - name: WORKER_IMAGE
              value: continuum/image-batch-worker:fns-v1
            - name: JOB_TTL_SECONDS
              value: "3600"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: image-batch-adapter
  namespace: fns-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: image-batch-adapter
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
